name: Workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/setup/requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python scripts/setup/verify_layout.py
